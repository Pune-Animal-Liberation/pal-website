media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: body
        label: Body
        type: markdown

  - name: events
    label: Events
    type: collection
    path: src/content/events
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: location
        label: Location
        type: string
      - name: body
        label: Body
        type: markdown