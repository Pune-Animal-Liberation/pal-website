media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{fields.title}.md"

    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date
        default: "{{now}}"

      - name: author
        label: Author
        type: string

      - name: image
        label: Cover Image
        type: image
        required: false

      - name: body
        label: Body
        type: rich-text


  - name: events
    label: Events
    type: collection
    path: src/content/events
    filename: "{fields.title}.md"

    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: time
        label: Time
        type: string
        required: false

      - name: location
        label: Location
        type: string

      - name: mapLink
        label: Map Link
        type: string
        required: false

      - name: contactPerson
        label: Contact Person
        type: string
        required: false

      - name: body
        label: Body
        type: rich-text